name: Maven CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  # A new push to the same branch makes the previous run irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the whole workflow; the one job that needs more widens it itself.
permissions:
  contents: read

env:
  MAVEN_ARGS: -B -ntp

jobs:
  build:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write  # Needed for mikepenz/action-junit-report to create check runs

    strategy:
      fail-fast: false
      matrix:
        # 23 is the target; 21 (the previous LTS) stays covered as the supported floor.
        java: [ '21', '23' ]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # The pom pins maven.compiler.release to 23, and javac rejects a release newer than
      # itself, so the floor leg has to target its own JDK or it cannot compile at all.
      - name: Compile
        run: mvn $MAVEN_ARGS clean compile -Dmaven.compiler.release=${{ matrix.java }}

      # ubuntu-latest ships a running Docker daemon, which is all SchemaMigrationIT needs
      # from the runner; Testcontainers pulls postgres:16-alpine itself.
      - name: Unit & integration tests
        run: mvn $MAVEN_ARGS verify -Dmaven.compiler.release=${{ matrix.java }}

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always() && matrix.java == '23'
        with:
          # report_paths feeds core.getMultilineInput, which splits on newlines, not commas —
          # a comma-joined single line becomes one glob with a literal "," and matches nothing.
          report_paths: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          check_name: Test results
          require_tests: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() && matrix.java == '23'
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 7
          if-no-files-found: warn

  package:
    name: Package boot jar
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      # Tests already passed in the build job; repeating them here buys nothing.
      - name: Package
        run: mvn $MAVEN_ARGS -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: motorcycle-comparison-api
          path: target/*.jar
          retention-days: 14
