name: Maven CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  # A new push to the same branch makes the previous run irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -ntp

jobs:
  build:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 21 is the target; 23 is an early warning for the next upgrade.
        java: [ '21', '23' ]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile
        run: mvn $MAVEN_ARGS clean compile

      - name: Unit & integration tests
        run: mvn $MAVEN_ARGS verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always() && matrix.java == '21'
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: Test results

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always() && matrix.java == '21'
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 7
          if-no-files-found: warn

  package:
    name: Package boot jar
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tests already passed in the build job; repeating them here buys nothing.
      - name: Package
        run: mvn $MAVEN_ARGS -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: motorcycle-comparison-api
          path: target/*.jar
          retention-days: 14
