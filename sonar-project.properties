# Note: SonarQube Cloud's Automatic Analysis (Auto-Scan) ignores this file.
# The equivalent exclusion must also be set in the UI:
# Administration > General Settings > Analysis Scope > Duplications > Duplication Exclusions
# See: https://docs.sonarsource.com/sonarqube-cloud/managing-your-projects/project-analysis/setting-analysis-scope/exclude-from-coverage-duplication
#
# Flyway seed scripts are bulk INSERT data, not application logic — their inherent
# row-to-row repetition isn't real duplication, so keep it out of the CPD check.
sonar.cpd.exclusions=src/main/resources/db/seed/**/*.sql
