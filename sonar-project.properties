# Auto-Scan ignores this file; set the same exclusion in Administration > General Settings > Analysis Scope > Duplications.
# Seed scripts are bulk INSERT data, not logic: https://docs.sonarsource.com/sonarqube-cloud/managing-your-projects/project-analysis/setting-analysis-scope/exclude-from-coverage-duplication
sonar.cpd.exclusions=src/main/resources/db/seed/**/*.sql

# PostgreSQL, not Oracle: here '' is a real empty string, so the PL/SQL analyzer reading btrim(x) <> '' as a
# NULL comparison is wrong in all 10 places. Auto-Scan: set this under Languages > PL/SQL > File Suffixes.
sonar.plsql.file.suffixes=.pkb,.pks,.pls,.plsql
