spring:
  application:
    name: motorcycle-comparison-api

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/motorcycle_comparison}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: motorcycle-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 20000
      validation-timeout: 5000
      idle-timeout: 300000
      keepalive-time: 120000
      # Must stay below any proxy/PgBouncer idle cut-off: retire the socket here, or
      # Hikari hands out a connection the network dropped minutes ago.
      max-lifetime: 1200000
      # Logs the stack trace of a connection held this long; a leak, not a slow query.
      leak-detection-threshold: 30000
      data-source-properties:
        # Server-side ceilings so a runaway statement or an abandoned transaction cannot
        # pin a connection forever; socketTimeout is the client-side backstop, in seconds.
        socketTimeout: 30
        tcpKeepAlive: true
        ApplicationName: motorcycle-comparison-api
        options: "-c statement_timeout=10000 -c idle_in_transaction_session_timeout=30000"

  # Schema is owned by the migrations in db/migration; db/search is separate because
  # CREATE EXTENSION needs privileges some managed environments do not hand out.
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/search
    # Greenfield: an empty schema is the only valid starting point, and baselining
    # would falsely record V1 as already applied.
    baseline-on-migrate: false

  transaction:
    # A request that has not finished in 15s is not going to; free the connection.
    default-timeout: 15

  jpa:
    # Off by default: keeping a session open for view rendering is how lazy loading
    # silently becomes N+1 inside the serializer. The service layer decides what to fetch.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        # Loads the lazy to-one specification blocks of a whole page in one extra
        # query instead of one per row.
        default_batch_fetch_size: 32
        order_inserts: true
        order_updates: true
        order_by:
          # A figure the manufacturer never published sorts last in both directions. PostgreSQL
          # would otherwise open "most expensive first" with every unpriced bike.
          default_null_ordering: last
        query:
          # Pads IN lists to the next power of two so the comparison endpoint reuses
          # one prepared statement per size bucket instead of one per id count.
          in_clause_parameter_padding: true

  data:
    web:
      pageable:
        # The catalogue is public and every row carries both specification blocks; Spring's
        # own ceiling of 2000 is a free amplification lever on an unauthenticated endpoint.
        max-page-size: 100

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mvc:
    problemdetails:
      enabled: false

  servlet:
    multipart:
      # Transport backstop, deliberately above app.storage.images.max-file-size: set to the same value,
      # Tomcat would always abort first and the business rule's own 400 could never fire.
      max-file-size: ${IMAGE_MAX_UPLOAD_SIZE:6MB}
      max-request-size: ${IMAGE_MAX_REQUEST_SIZE:7MB}

server:
  port: ${SERVER_PORT:8080}
  # This API sits behind a TLS-terminating proxy: without this request.isSecure() is always false, so HSTS is never
  # emitted and the POST Location is built from the internal http scheme. Set "none" when NOT behind a trusted proxy.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  error:
    include-stacktrace: never
    include-message: never
  compression:
    enabled: true
    mime-types: application/json
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      # Without this, "authorized" means any authenticated principal, including the non-admin editor: /actuator/health
      # is the one actuator endpoint PUBLIC_PATHS lets them reach, so this hides DB, disk and component-level detail.
      roles: ADMIN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  api:
    version: v1
  comparison:
    # Four columns is where a side-by-side table stops being readable on a laptop.
    max-items: 4
  storage:
    images:
      # Resolved against the process working directory. A deployed environment must point this at a
      # mounted volume: a container's own file system is discarded on every redeploy.
      location: ${IMAGE_STORAGE_LOCATION:./uploads/motorcycles}
      # The business rule. spring.servlet.multipart above only stops the transfer earlier and cheaper.
      max-file-size: ${IMAGE_MAX_FILE_SIZE:5MB}
  security:
    # Explicit opt-in for booting on the dev fallbacks below with no profile active at all; see DevDefaultsGuard.
    # A deployment that forgets SPRING_PROFILES_ACTIVE must fail, not inherit the committed secret and admin123.
    allow-dev-defaults: ${ALLOW_DEV_DEFAULTS:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    jwt:
      # Base64, >= 32 bytes decoded. No fallback on purpose: a default committed here is
      # public knowledge, so anything but dev must supply it or fail to start.
      secret: ${JWT_SECRET}
      ttl: ${JWT_TTL:PT2H}
      issuer: motorcycle-comparison-api
    users:
      admin:
        username: ${ADMIN_USERNAME:admin}
        password: ${ADMIN_PASSWORD}
      editor:
        username: ${EDITOR_USERNAME:editor}
        password: ${EDITOR_PASSWORD}

logging:
  level:
    com.motorcycle.comparison: ${LOG_LEVEL:INFO}

---
# Local development: same migrated schema as production, plus the repeatable dev seed
# and verbose SQL logging. Seeding and logging are the only differences from prod.
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/search,classpath:db/seed
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
app:
  security:
    # The committed credentials live here and nowhere else: confined to the dev profile,
    # forgetting to override them in a deployed environment cannot silently succeed.
    jwt:
      secret: ${JWT_SECRET:cWNKFJMcbggRga1+khWjTK94037jYuxzSZf51LeOElDAa30IJtph+58whj0Elj0r}
    users:
      admin:
        password: ${ADMIN_PASSWORD:admin123}
      editor:
        password: ${EDITOR_PASSWORD:editor123}
logging:
  level:
    com.motorcycle.comparison: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

---
# Deployed environments: Flyway owns the schema, Hibernate only validates it, and the
# dev seed location is never on the list.
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
management:
  endpoint:
    health:
      show-details: never
# The exact shape of the write endpoints and their validation rules is reconnaissance a prod deployment should not
# publish. Dev keeps the docs; disabled, PUBLIC_PATHS' /v3/api-docs/** and /swagger-ui/** fall through to a 404.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
